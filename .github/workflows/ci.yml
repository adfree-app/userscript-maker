name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # semantic-release: commit the version bump + changelog, create the tag
  issues: write
  pull-requests: write
  packages: write # publish to https://npm.pkg.github.com

env:
  CI: true

jobs:
  check:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run fmt:check

      - name: Type check (tsc --noEmit)
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build the fixture userscripts
        run: bun run check:fixtures

      - name: Pack the tarball
        run: bun pm pack --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: semantic-release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: ${{ github.repository_owner }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Release (tag, changelog, GitHub release, tarball asset)
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --no-install semantic-release \
            --repository-url "https://github.com/${{ github.repository }}.git"
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "released: ${tag:-nothing}"

      - name: Publish to GitHub Packages
        if: steps.release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/publish-github-packages.sh
